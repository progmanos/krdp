<busconfig>

  <!-- Only the system-level dispatcher (running as root) may own the service -->
  <policy user="root">
    <allow own="org.kde.krdp.Dispatcher"/>
    <allow send_destination="org.kde.krdp.Dispatcher"/>
    <allow receive_sender="org.kde.krdp.Dispatcher"/>
  </policy>

  <!-- Session daemons running as the logged-in user need to talk to it,
       except root-only display manager methods (AuthorizeHandover and
       TransferHandover) -->
  <policy context="default">
    <allow send_destination="org.kde.krdp.Dispatcher"/>
    <deny send_destination="org.kde.krdp.Dispatcher"
          send_interface="org.kde.krdp.Dispatcher"
          send_member="AuthorizeHandover"/>
    <deny send_destination="org.kde.krdp.Dispatcher"
          send_interface="org.kde.krdp.Dispatcher"
          send_member="TransferHandover"/>
    <allow receive_sender="org.kde.krdp.Dispatcher"/>
  </policy>

</busconfig>
